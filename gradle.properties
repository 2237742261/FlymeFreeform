org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 本机没有 android-37 platform（sdkmanager 里最高 36），靠这个开关放行
# 依赖 AAR 元数据里的 "compile against 37 or later" 校验
android.experimental.disableCompileSdkChecks=true
# maven 上的 aapt2 只有 x86_64（本机 arm64 跑不了）→ 用 qemu-user 包一层（脚本见 /workspace/build/sdk/aapt2）
android.aapt2FromMavenOverride=/dev/ws/sdk/aapt2
# 工作区路径含非 ASCII（flyme小窗）；Windows 上显式关闭 AGP 的路径校验。
android.overridePathCheck=true
kotlin.code.style=official
kotlinGradlePluginVersion=2.4.0

flymeFreeformVersionCode=37
flymeFreeformVersionName=0.2.13
